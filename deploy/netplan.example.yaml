# Example only. Interface names are unique per PC (`ip -br link`).
# Copy to /etc/netplan/60-foyer.yaml after editing, then:
#   sudo netplan generate && sudo netplan apply
network:
  version: 2
  ethernets:
    enp1s0: # AV-LAN — DSP, door tablet, config laptop. No default route.
      dhcp4: false
      addresses: [10.0.25.10/24]
      routes: []
    enp2s0: # LAN (internet) — calendar, apt, GitHub, Relay telemetry
      dhcp4: true
