# Example only. Interface names are unique per PC (`ip -br link`).
# Copy to /etc/netplan/60-foyer.yaml after editing, then:
#   sudo netplan generate && sudo netplan apply
network:
  version: 2
  ethernets:
    enp1s0: # AV LAN — Relay / DSP. No default route.
      dhcp4: false
      addresses: [10.20.0.10/24]
      routes: []
    enp2s0: # Outbound — calendar, apt, GitHub
      dhcp4: true
    enp3s0: # Rack AP — room plate only
      dhcp4: false
      addresses: [10.64.0.1/24]
